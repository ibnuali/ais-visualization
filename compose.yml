services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ais_anomaly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ais_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ais_anomaly
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:3000/health'').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      target: api
    restart: unless-stopped
    command: ["bun", "apps/api/worker.ts"]
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ais_anomaly
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5299:80"

volumes:
  pgdata:
